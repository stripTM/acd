; Ajustes de PHP para el entorno de desarrollo de ACD
; Los errores van al log del contenedor: docker compose logs -f app
date.timezone = Europe/Madrid
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr
